services:
  # ── Frontend (React + Vite → Nginx) ──
  frontend:
    build:
      context: ./smart-irigasi
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: smart-irigasi-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # ── Backend (Express.js + Mongoose + MQTT) ──
  backend:
    build:
      context: ./smart-irigasi-backend
      dockerfile: Dockerfile
    container_name: smart-irigasi-backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/smart-irigasi
      - JWT_SECRET=${JWT_SECRET:-smart-irigasi-rahasia-123}
      - JWT_EXPIRES=${JWT_EXPIRES:-7d}
      # MQTT (HiveMQ Cloud)
      - MQTT_HOST=${MQTT_HOST:-cf4a7a1d069a4006a890870dea8d1a3d.s1.eu.hivemq.cloud}
      - MQTT_PORT=${MQTT_PORT:-8883}
      - MQTT_USERNAME=${MQTT_USERNAME:-irigasi-user}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-Irigasi-pass-123}
      # VAPID Keys (Web Push)
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-BIlKGfJBxo5sS0OOHj5I3KopGjJaBQ_P4GA2l4wb6oGVCeEamXBFlr9Qj-cQuOKaMGgf6v-1sPxHIp4OybZ20jY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-R44zL3yO_vwkh98H2_iTixkyULy87jTMbqsNP59scSM}
      - VAPID_EMAIL=${VAPID_EMAIL:-mailto:eljaadrian4@gmail.com}
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  # ── MongoDB ──
  mongo:
    image: mongo:7
    container_name: smart-irigasi-mongo
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodata:
